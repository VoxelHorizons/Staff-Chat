name: Build Staff Chat

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java 25 and Maven cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and verify plugin
        run: mvn -B --no-transfer-progress clean verify
      - name: Upload test JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Staff-Chat-1.4.8-Paper-26.3
          path: target/DiscordSRV-Staff-Chat-1.4.8.jar
          if-no-files-found: error
          retention-days: 14
